repos:
  - repo: local
    hooks:
      - id: ascii-commit-msg
        name: Commit message is pure ASCII
        language: pygrep
        entry: '[^\x00-\x7F]'
        stages: [commit-msg]

      - id: author-in-roster
        name: Commit author is in the developer roster
        language: system
        entry: sh -c 'uv run --no-sync python -m equa.ci.developers check-author || true'
        pass_filenames: false
        verbose: true
        stages: [commit-msg]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.25.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
