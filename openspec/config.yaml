schema: spec-driven

context: |
  cfd-viewer: browser post-processing for OpenFOAM cases (IDA ICE CFD backend).
  React + Mantine + three.js client (web/) over a Python/VTK extraction server
  (foamviz/ reads OpenFOAM and drives filters, server/ packs geometry on the wire).
  The server never renders. CLAUDE.md is the authoritative design record: read it,
  especially the part model (PART_INPUTS signatures) and the client/server table.
  Working agreements: ask before big changes (new dependency, rendering path,
  schema change); reuse/generalise before adding; prefer a class to long argument
  lists; prefer client-side (three.js) over a server call; be careful with API
  changes to foamviz/ (case.py, pipeline.py, colors.py).
  Tests: tests/test_pipeline.py (VTK pipeline), tests/check_client.py (Chromium;
  counts /api/scene refetches per control). Keep both green.

rules:
  design:
    - For any new control, state whether it is client or server, and which part's
      signature it moves (or which cheap endpoint serves it)
  tasks:
    - Include updating CLAUDE.md and the relevant test suite

